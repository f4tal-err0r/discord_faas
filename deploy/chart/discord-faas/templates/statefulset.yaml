apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "discord-faas.fullname" . }}
  labels:
    {{- include "discord-faas.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "discord-faas.selectorLabels" . | nindent 6 }}
  serviceName: discord-faas
  replicas: 1
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "discord-faas.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "discord-faas.serviceAccountName" . }}
      containers:
      - name: {{ .Chart.Name }}
        command: ["/app/faas_server"]
        args: ["server", "start"]
        env: 
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: Always
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        volumeMounts:
          - mountPath: /app/config
            name: {{ .Chart.Name }}-config
            readOnly: true
          - mountPath: /app/data
            name: {{ .Chart.Name }}-workspace
          - mountPath: /app/certs
            name: {{ .Chart.Name }}-jwt
            readOnly: true
        envFrom:
        - secretRef:
            name: discord-faas
        - secretRef:
            name: faas-minio-root
      - name: filestore
        image: minio/minio:RELEASE.2025-03-12T18-04-18Z-cpuv1
        args: ["server", "/opt/data"]
        env: 
        - name: MINIO_BROWSER
          value: off
        - name: MINIO_SERVER_URL
          value: "http://discord-faas:9000"
        envFrom:
        - secretRef:
            name: faas-minio-root
        volumeMounts:
        - name: faas-artifacts-store
          mountPath: /opt/data
          readOnly: false
        ports:
        - containerPort: 9000
          hostPort: 9000
      volumes:
      - name: config
        configMap:
          name: discord-faas-config
          defaultMode: 0644
      - name: faas-jwt
        secret:
          secretName: faas-jwt
          defaultMode: 0644
  volumeClaimTemplates:
  - metadata:
      name: faas-workspace
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
  - metadata:
      name: faas-artifacts-store
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi