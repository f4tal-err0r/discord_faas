apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-faas
spec:
  selector:
    matchLabels:
      app: discord-faas
  serviceName: discord-faas
  replicas: 1
  template:
    metadata:
      labels:
        app: discord-faas
    spec:
      serviceAccountName: discord-faas
      containers:
      - name: discord-faas-controller
        command: ["/app/faas_server"]
        args: ["server", "start", "--config", "/app/config/config.yaml"]
        env: 
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: ghcr.io/f4tal-err0r/discord-faas:dev
        imagePullPolicy: Always
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: 1
        volumeMounts:
          - mountPath: /app/config
            name: config
            readOnly: true
          - mountPath: /app/data
            name: faas-workspace
          - mountPath: /app/certs
            name: faas-jwt
            readOnly: true
        envFrom:
        - secretRef:
            name: discord-faas
        - secretRef:
            name: faas-minio-root
  volumes:
  - name: config
    configMap:
      name: discord-faas-config
      defaultMode: 0644
  - name: faas-jwt
    secret:
      secretName: faas-jwt
      defaultMode: 0644
