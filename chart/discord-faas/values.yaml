
replicaCount: 1

image:
  repository: ghcr.io/f4tal-err0r/discord-faas
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: "discord-faas"

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  
securityContext: {}
            
service:
    type: ClusterIP
    port: 8080

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
      
resources: 
  limits:
    cpu: 100m
    memory: 640Mi
  requests:
    cpu: 100m
    memory: 640Mi

autoscaling:
  enabled: false

discord: 
  clientid: "" ## Bot client id, fetch in discord developer page
  botToken: "" ## Bot token, fetch in discord developer page

faas:
  config:
    dbpath: "/app/data/dfaas.db"
    domain: "" ## Domain for the bot to use for the API path (ie discord.com)
    storage:
      type: "local"
      path: "/app/data/"
      size: "10Gi"
      s3:
        hostname: ""
        username: ""
        password: ""
    runner:
      image: "alpine:latest"
    builder:
      image: "alpine:latest"
    JWTSecretKey: "" ## JWT Secret Key for signing tokens, if empty a random one will be generated on startup

minioSidecar:
  enabled: false
  rootUser: "root-user"
  rootPassword: "minio123"

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
