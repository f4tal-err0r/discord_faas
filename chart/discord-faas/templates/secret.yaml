apiVersion: v1
kind: Secret
metadata:
  name: {{ include "discord-faas.fullname" . }}
type: Opaque
data:
  DISCORD_TOKEN: {{ required "A valid .Values.discord.botToken entry required!" .Values.discord.botToken | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "discord-faas.fullname" . }}-s3-creds
type: Opaque
data:
  {{- if .Values.minioSidecar.enabled }}
  S3_USERNAME: {{ required "A valid .Values.minioSidecar.rootUser entry required!" .Values.minioSidecar.rootUser | b64enc | quote }}
  S3_PASSWORD: {{ required "A valid .Values.minioSidecar.rootPassword entry required!" .Values.minioSidecar.rootPassword | b64enc | quote }}
  {{- else }}
  S3_USERNAME: {{ required "A valid .Values.storage.s3.username entry required!" .Values.storage.s3.username | b64enc | quote }}
  S3_PASSWORD: {{ required "A valid .Values.storage.s3.password entry required!" .Values.storage.s3.password | b64enc | quote }}
  {{- end }}

